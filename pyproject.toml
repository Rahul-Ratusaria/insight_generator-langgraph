[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-pdf-insight-generator"
version = "2.0.0"
description = "Evidence-first, resumable LangGraph PDF analytics insights"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.3,<2", "langgraph-checkpoint-sqlite>=2,<4", "openai>=1.80,<3", "pydantic>=2.7,<3", "pymupdf>=1.24,<2", "streamlit>=1.38,<2", "pandas>=2.1,<3", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
insight-generator = "insight_generator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
